<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hero Defender">
<title>Hero Defender</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=hd7">
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="waveBox"><span class="lbl">FALA</span><span id="waveNum">1</span></div>
      <div id="xpWrap">
        <div id="xpBar"><div id="xpFill"></div></div>
        <div id="lvlTxt">Poziom 1</div>
        <div id="hpRow"><span class="heart">❤</span><div id="hpBar"><div id="hpFill"></div></div><span id="hpTxt"></span></div>
        <div id="wpnRow"></div>
      </div>
      <button id="speedBtn" aria-label="Szybkość gry">×1</button>
      <button id="pauseBtn" aria-label="Pauza">❚❚</button>
    </div>
    <div id="bossBar" class="hidden">
      <div id="bossName">BOSS</div>
      <div id="bossHp"><div id="bossHpFill"></div></div>
    </div>
    <button id="skillBtn" aria-label="Deszcz strzał">
      <span class="ico">☄</span>
      <span class="cd" id="skillCd"></span>
      <svg viewBox="0 0 100 100"><circle id="skillRing" cx="50" cy="50" r="46"/></svg>
    </button>
    <div id="hint">Przesuń palcem, żeby chodzić<br><small>Bohater sam atakuje najbliższych wrogów</small></div>
  </div>

  <!-- Menu -->
  <div id="menu" class="screen">
    <div class="menuInner">
      <div class="logoSmall">✠</div>
      <h1>Hero<br>Defender</h1>
      <p class="tag">Siedmiu bohaterów. Piętnaście broni. Noc bez końca.</p>
      <button class="btn big" id="playBtn">Graj</button>
      <button class="btn ghost" id="shopBtn">👻 Kuźnia Dusz</button>
      <div class="stats" id="menuStats"></div>
      <p class="tiny">Wersja 1.0</p>
    </div>
  </div>

  <!-- Wybór klasy -->
  <div id="classScreen" class="screen hidden">
    <h2>Wybierz bohatera</h2>
    <div id="classList"></div>
    <button class="btn ghost" id="classBack">Wróć</button>
  </div>

  <!-- Kuźnia Dusz -->
  <div id="shopScreen" class="screen hidden">
    <h2>Kuźnia Dusz</h2>
    <p class="sub">Stałe ulepszenia na każdą rozgrywkę · masz <b id="shopSouls">0</b> 👻</p>
    <div id="shopList"></div>
    <button class="btn ghost" id="shopBack">Wróć</button>
  </div>

  <!-- Wybór kart (level up / błogosławieństwo) -->
  <div id="cardScreen" class="screen hidden dim">
    <h2 id="cardTitle">Nowy poziom!</h2>
    <p id="cardSub" class="sub"></p>
    <div id="cards"></div>
    <button class="btn ghost small" id="rerollBtn">Przelosuj (<span id="rerollN">2</span>)</button>
  </div>

  <!-- Pauza -->
  <div id="pauseScreen" class="screen hidden dim">
    <h2>Pauza</h2>
    <div id="buildList"></div>
    <button class="btn" id="resumeBtn">Wznów</button>
    <button class="btn ghost" id="soundBtn">Dźwięk: wł.</button>
    <button class="btn ghost" id="quitBtn">Zakończ rozgrywkę</button>
  </div>

  <!-- Koniec gry -->
  <div id="overScreen" class="screen hidden dim">
    <h2 class="blood">Poległeś</h2>
    <div id="overStats"></div>
    <button class="btn big" id="againBtn">Jeszcze raz</button>
    <button class="btn ghost" id="overShopBtn">👻 Kuźnia Dusz</button>
    <button class="btn ghost" id="menuBtn">Menu</button>
  </div>
</div>
<script src="data.js?v=hd7"></script>
<script src="meta.js?v=hd7"></script>
<script src="audio.js?v=hd7"></script>
<script src="render.js?v=hd7"></script>
<script src="game.js?v=hd7"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=hd7').catch(() => {}));
}
</script>
</body>
</html>
